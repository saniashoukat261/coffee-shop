<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Artisan Coffee House</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f7f3ef;
        color: #2b1d16;
    }
    header {
        background: #2b1d16;
        color: #fff;
        padding: 16px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    header h1 { font-size: 18px; margin: 0; }
    header .user-info { font-size: 13px; color: #d8c6b8; }
    header button {
        background: #a97155;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        margin-left: 12px;
    }
    header button:hover { background: #8f5c42; }
    .tabs {
        display: flex;
        gap: 4px;
        background: #fff;
        padding: 0 20px;
        border-bottom: 1px solid #eee;
        overflow-x: auto;
    }
    .tab-btn {
        padding: 14px 18px;
        border: none;
        background: none;
        font-size: 14px;
        font-weight: 600;
        color: #888;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        white-space: nowrap;
    }
    .tab-btn.active { color: #a97155; border-bottom-color: #a97155; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card-box {
        background: #fff;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
    th { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
    .status-select {
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #ddd;
        font-size: 13px;
    }
    .empty-msg { color: #999; text-align: center; padding: 30px 0; }
    .add-item-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        margin-bottom: 20px;
    }
    .add-item-form input, .add-item-form select {
        padding: 9px 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 13px;
        width: 100%;
    }
    .add-item-form button {
        grid-column: 1 / -1;
        padding: 10px;
        background: #a97155;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
    }
    .add-item-form button:hover { background: #8f5c42; }
    .row-actions button {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 13px;
        margin-right: 8px;
        padding: 4px 8px;
        border-radius: 5px;
    }
    .edit-btn { color: #2b6cb0; background: #ebf4ff !important; }
    .delete-btn { color: #b3261e; background: #fdecea !important; }
    .save-btn { color: #1a7f37; background: #e8f8ee !important; }
    .cancel-btn { color: #666; background: #f0f0f0 !important; }
    .msg-banner {
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
    }
    .msg-banner.success { background: #e8f8ee; color: #1a7f37; display: block; }
    .msg-banner.error { background: #fdecea; color: #b3261e; display: block; }
    .edit-input { width: 100%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>

<header>
    <h1>☕ Artisan Coffee House — Admin</h1>
    <div>
        <span class="user-info" id="userInfo"></span>
        <button id="logoutBtn">Log Out</button>
    </div>
</header>

<div class="tabs">
    <button class="tab-btn active" data-tab="orders">Orders</button>
    <button class="tab-btn" data-tab="contacts">Contacts</button>
    <button class="tab-btn" data-tab="reservations">Reservations</button>
    <button class="tab-btn" data-tab="menu">Menu</button>
    <button class="tab-btn" data-tab="subscribers">Subscribers</button>
</div>

<main>
    <div id="msgBanner" class="msg-banner"></div>

    <!-- ORDERS -->
    <div class="panel active" id="panel-orders">
        <div class="card-box">
            <table>
                <thead>
                    <tr><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Placed</th></tr>
                </thead>
                <tbody id="ordersTableBody"></tbody>
            </table>
            <div class="empty-msg" id="ordersEmptyMsg" style="display:none;">No orders yet.</div>
        </div>
    </div>

    <!-- CONTACTS -->
    <div class="panel" id="panel-contacts">
        <div class="card-box">
            <table>
                <thead>
                    <tr><th>Name</th><th>Email</th><th>Message</th><th>Received</th></tr>
                </thead>
                <tbody id="contactsTableBody"></tbody>
            </table>
            <div class="empty-msg" id="contactsEmptyMsg" style="display:none;">No messages yet.</div>
        </div>
    </div>

    <!-- RESERVATIONS -->
    <div class="panel" id="panel-reservations">
        <div class="card-box">
            <table>
                <thead>
                    <tr><th>Name</th><th>Phone</th><th>Date</th><th>Time</th><th>Guests</th></tr>
                </thead>
                <tbody id="reservationsTableBody"></tbody>
            </table>
            <div class="empty-msg" id="reservationsEmptyMsg" style="display:none;">No reservations yet.</div>
        </div>
    </div>

    <!-- MENU -->
    <div class="panel" id="panel-menu">
        <div class="card-box">
            <h3 style="margin-top:0;">Add a new menu item</h3>
            <form class="add-item-form" id="addMenuForm">
                <input type="text" id="newName" placeholder="Item name" required>
                <input type="text" id="newDescription" placeholder="Description (optional)">
                <input type="number" id="newPrice" placeholder="Price" step="0.01" min="0" required>
                <select id="newCategory">
                    <option value="signature">Signature</option>
                    <option value="hot">Hot</option>
                    <option value="iced">Iced</option>
                    <option value="treats">Treats</option>
                    <option value="snacks">Snacks</option>
                </select>
                <input type="url" id="newImage" placeholder="Image URL (optional, for signature drinks)">
                <button type="submit">Add Item</button>
            </form>
        </div>
        <div class="card-box">
            <table>
                <thead>
                    <tr><th>Name</th><th>Category</th><th>Price</th><th>Description</th><th>Actions</th></tr>
                </thead>
                <tbody id="menuTableBody"></tbody>
            </table>
            <div class="empty-msg" id="menuEmptyMsg" style="display:none;">No menu items yet.</div>
        </div>
    </div>

    <!-- SUBSCRIBERS -->
    <div class="panel" id="panel-subscribers">
        <div class="card-box">
            <table>
                <thead>
                    <tr><th>Email</th><th>Subscribed On</th></tr>
                </thead>
                <tbody id="subscribersTableBody"></tbody>
            </table>
            <div class="empty-msg" id="subscribersEmptyMsg" style="display:none;">No subscribers yet.</div>
        </div>
    </div>
</main>

<script>
function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
}
function showBanner(text, type) {
    const banner = document.getElementById('msgBanner');
    banner.textContent = text;
    banner.className = 'msg-banner ' + type;
    setTimeout(() => { banner.style.display = 'none'; }, 4000);
}

// ---- Auth check ----
(async function checkAuth() {
    try {
        const res = await fetch('/api/admin/check');
        const data = await res.json();
        if (!data.isAdmin) {
            window.location.href = 'admin-login.html';
            return;
        }
        document.getElementById('userInfo').textContent = 'Logged in as ' + data.username;
        loadOrders();
        loadContacts();
        loadReservations();
        loadMenu();
        loadSubscribers();
    } catch (err) {
        window.location.href = 'admin-login.html';
    }
})();

document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/admin/logout', { method: 'POST' });
    window.location.href = 'admin-login.html';
});

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.getAttribute('data-tab')).classList.add('active');
    });
});

// ---- Orders ----
async function loadOrders() {
    const tbody = document.getElementById('ordersTableBody');
    const emptyMsg = document.getElementById('ordersEmptyMsg');
    try {
        const res = await fetch('/api/orders');
        const data = await res.json();
        if (!data.success || !data.data.length) {
            tbody.innerHTML = '';
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';
        tbody.innerHTML = data.data.map(order => {
            const itemsSummary = (order.items || []).map(i => `${escapeHtml(i.name)} x${i.quantity}`).join(', ');
            const statuses = ['pending', 'preparing', 'out for delivery', 'delivered'];
            const options = statuses.map(s => `<option value="${s}" ${order.status === s ? 'selected' : ''}>${s}</option>`).join('');
            const date = new Date(order.createdAt).toLocaleString();
            return `
                <tr>
                    <td>${escapeHtml(order.customerName)}</td>
                    <td>${itemsSummary}</td>
                    <td>$${Number(order.total).toFixed(2)}</td>
                    <td><select class="status-select" data-id="${order._id}">${options}</select></td>
                    <td>${date}</td>
                </tr>`;
        }).join('');

        tbody.querySelectorAll('.status-select').forEach(sel => {
            sel.addEventListener('change', async () => {
                const id = sel.getAttribute('data-id');
                try {
                    const res = await fetch(`/api/orders/${id}/status`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: sel.value })
                    });
                    const result = await res.json();
                    if (result.success) {
                        showBanner('Order status updated.', 'success');
                    } else {
                        showBanner(result.message || 'Could not update status.', 'error');
                    }
                } catch (err) {
                    showBanner('Could not reach the server.', 'error');
                }
            });
        });
    } catch (err) {
        tbody.innerHTML = '';
        emptyMsg.textContent = 'Could not load orders.';
        emptyMsg.style.display = 'block';
    }
}

// ---- Contacts ----
async function loadContacts() {
    const tbody = document.getElementById('contactsTableBody');
    const emptyMsg = document.getElementById('contactsEmptyMsg');
    try {
        const res = await fetch('/api/contact');
        const data = await res.json();
        if (!data.success || !data.data.length) {
            tbody.innerHTML = '';
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';
        tbody.innerHTML = data.data.map(c => `
            <tr>
                <td>${escapeHtml(c.name)}</td>
                <td>${escapeHtml(c.email)}</td>
                <td>${escapeHtml(c.message)}</td>
                <td>${new Date(c.createdAt).toLocaleString()}</td>
            </tr>`).join('');
    } catch (err) {
        emptyMsg.textContent = 'Could not load messages.';
        emptyMsg.style.display = 'block';
    }
}

// ---- Reservations ----
async function loadReservations() {
    const tbody = document.getElementById('reservationsTableBody');
    const emptyMsg = document.getElementById('reservationsEmptyMsg');
    try {
        const res = await fetch('/api/reservations');
        const data = await res.json();
        if (!data.success || !data.data.length) {
            tbody.innerHTML = '';
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';
        tbody.innerHTML = data.data.map(r => `
            <tr>
                <td>${escapeHtml(r.name)}</td>
                <td>${escapeHtml(r.phone)}</td>
                <td>${escapeHtml(r.date)}</td>
                <td>${escapeHtml(r.time)}</td>
                <td>${escapeHtml(r.guests)}</td>
            </tr>`).join('');
    } catch (err) {
        emptyMsg.textContent = 'Could not load reservations.';
        emptyMsg.style.display = 'block';
    }
}

// ---- Subscribers ----
async function loadSubscribers() {
    const tbody = document.getElementById('subscribersTableBody');
    const emptyMsg = document.getElementById('subscribersEmptyMsg');
    try {
        const res = await fetch('/api/subscribe');
        const data = await res.json();
        if (!data.success || !data.data.length) {
            tbody.innerHTML = '';
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';
        tbody.innerHTML = data.data.map(s => `
            <tr>
                <td>${escapeHtml(s.email)}</td>
                <td>${new Date(s.subscribedAt).toLocaleDateString()}</td>
            </tr>`).join('');
    } catch (err) {
        emptyMsg.textContent = 'Could not load subscribers.';
        emptyMsg.style.display = 'block';
    }
}

// ---- Menu ----
async function loadMenu() {
    const tbody = document.getElementById('menuTableBody');
    const emptyMsg = document.getElementById('menuEmptyMsg');
    try {
        const res = await fetch('/api/menu');
        const data = await res.json();
        if (!data.success || !data.data.length) {
            tbody.innerHTML = '';
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';
        tbody.innerHTML = data.data.map(item => renderMenuRow(item)).join('');
        attachMenuRowHandlers();
    } catch (err) {
        emptyMsg.textContent = 'Could not load menu items.';
        emptyMsg.style.display = 'block';
    }
}

function renderMenuRow(item) {
    return `
        <tr data-id="${item._id}" data-name="${escapeHtml(item.name)}" data-description="${escapeHtml(item.description || '')}" data-price="${item.price}" data-category="${item.category || 'hot'}" data-image="${escapeHtml(item.image || '')}">
            <td class="cell-name">${escapeHtml(item.name)}</td>
            <td class="cell-category">${escapeHtml(item.category || '')}</td>
            <td class="cell-price">$${Number(item.price).toFixed(2)}</td>
            <td class="cell-description">${escapeHtml(item.description || '')}</td>
            <td class="row-actions">
                <button class="edit-btn">Edit</button>
                <button class="delete-btn">Delete</button>
            </td>
        </tr>`;
}

function attachMenuRowHandlers() {
    document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => startEditRow(btn.closest('tr')));
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteMenuItem(btn.closest('tr')));
    });
}

function startEditRow(row) {
    const name = row.getAttribute('data-name');
    const description = row.getAttribute('data-description');
    const price = row.getAttribute('data-price');
    const category = row.getAttribute('data-category');

    row.querySelector('.cell-name').innerHTML = `<input class="edit-input" value="${escapeHtml(name)}" id="editName">`;
    row.querySelector('.cell-category').innerHTML = `
        <select class="edit-input" id="editCategory">
            ${['signature','hot','iced','treats','snacks'].map(c => `<option value="${c}" ${c === category ? 'selected' : ''}>${c}</option>`).join('')}
        </select>`;
    row.querySelector('.cell-price').innerHTML = `<input class="edit-input" type="number" step="0.01" min="0" value="${price}" id="editPrice">`;
    row.querySelector('.cell-description').innerHTML = `<input class="edit-input" value="${escapeHtml(description)}" id="editDescription">`;
    row.querySelector('.row-actions').innerHTML = `
        <button class="save-btn">Save</button>
        <button class="cancel-btn">Cancel</button>`;

    row.querySelector('.save-btn').addEventListener('click', () => saveEditRow(row));
    row.querySelector('.cancel-btn').addEventListener('click', () => loadMenu());
}

async function saveEditRow(row) {
    const id = row.getAttribute('data-id');
    const image = row.getAttribute('data-image');
    const name = row.querySelector('#editName').value.trim();
    const category = row.querySelector('#editCategory').value;
    const price = parseFloat(row.querySelector('#editPrice').value);
    const description = row.querySelector('#editDescription').value.trim();

    try {
        const res = await fetch(`/api/menu/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, description, price, category, image })
        });
        const data = await res.json();
        if (data.success) {
            showBanner('Menu item updated.', 'success');
            loadMenu();
        } else {
            showBanner(data.message || 'Could not update item.', 'error');
        }
    } catch (err) {
        showBanner('Could not reach the server.', 'error');
    }
}

async function deleteMenuItem(row) {
    const id = row.getAttribute('data-id');
    const name = row.getAttribute('data-name');
    if (!confirm(`Delete "${name}" from the menu? This cannot be undone.`)) return;

    try {
        const res = await fetch(`/api/menu/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
            showBanner('Menu item deleted.', 'success');
            loadMenu();
        } else {
            showBanner(data.message || 'Could not delete item.', 'error');
        }
    } catch (err) {
        showBanner('Could not reach the server.', 'error');
    }
}

document.getElementById('addMenuForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('newName').value.trim();
    const description = document.getElementById('newDescription').value.trim();
    const price = parseFloat(document.getElementById('newPrice').value);
    const category = document.getElementById('newCategory').value;
    const image = document.getElementById('newImage').value.trim();

    try {
        const res = await fetch('/api/menu', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, description, price, category, image })
        });
        const data = await res.json();
        if (data.success) {
            showBanner('Menu item added.', 'success');
            document.getElementById('addMenuForm').reset();
            loadMenu();
        } else {
            showBanner(data.message || 'Could not add item.', 'error');
        }
    } catch (err) {
        showBanner('Could not reach the server.', 'error');
    }
});
</script>
</body>
</html>
