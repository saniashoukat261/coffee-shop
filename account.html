<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Artisan Coffee House</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #f7f3ef;
        color: #2b1d16;
    }
    header {
        background: #2b1d16;
        color: #fff;
        padding: 16px 28px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    header h1 { font-size: 18px; margin: 0; }
    header a.home-link { color: #d8c6b8; font-size: 13px; text-decoration: none; margin-right: 16px; }
    header button {
        background: #a97155; color: #fff; border: none; padding: 8px 16px;
        border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    header button:hover { background: #8f5c42; }
    main { padding: 24px; max-width: 800px; margin: 0 auto; }
    .card-box {
        background: #fff; border-radius: 10px; padding: 22px;
        margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .card-box h2 { margin-top: 0; font-size: 17px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-row.full { grid-template-columns: 1fr; }
    input {
        width: 100%; padding: 10px 12px; border: 1px solid #ddd;
        border-radius: 8px; font-size: 14px;
    }
    input:focus { outline: none; border-color: #a97155; }
    .save-btn {
        padding: 10px 20px; background: #a97155; color: #fff; border: none;
        border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
    }
    .save-btn:hover { background: #8f5c42; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #f0f0f0; }
    th { color: #888; font-size: 12px; text-transform: uppercase; }
    .status-badge {
        padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
        display: inline-block;
    }
    .status-pending { background: #fff4e5; color: #b26a00; }
    .status-preparing { background: #e5f0ff; color: #0b5cad; }
    .status-out-for-delivery { background: #f0e5ff; color: #6a0bad; }
    .status-delivered { background: #e5ffe9; color: #0d8a2c; }
    .empty-msg { color: #999; text-align: center; padding: 30px 0; }
    .msg-banner { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
    .msg-banner.success { background: #e8f8ee; color: #1a7f37; display: block; }
    .msg-banner.error { background: #fdecea; color: #b3261e; display: block; }
    .greeting { color: #666; margin-bottom: 20px; }
</style>
</head>
<body>

<header>
    <h1>☕ My Account</h1>
    <div>
        <a href="index.html" class="home-link">← Back to website</a>
        <button id="logoutBtn">Log Out</button>
    </div>
</header>

<main>
    <p class="greeting" id="greeting"></p>
    <div class="msg-banner" id="msgBanner"></div>

    <div class="card-box">
        <h2>Saved Delivery Address</h2>
        <p style="color:#888; font-size:13px; margin-top:-8px;">Save this once, and it'll be ready to use next time you check out.</p>
        <form id="addressForm">
            <div class="form-row">
                <input type="text" id="addrFullName" placeholder="Full Name" required>
                <input type="tel" id="addrPhone" placeholder="Phone Number" required>
            </div>
            <div class="form-row full">
                <input type="text" id="addrStreet" placeholder="Street Address" required>
            </div>
            <div class="form-row full">
                <input type="text" id="addrCity" placeholder="City" required>
            </div>
            <button type="submit" class="save-btn">Save Address</button>
        </form>
    </div>

    <div class="card-box">
        <h2>Order History</h2>
        <table>
            <thead>
                <tr><th>Items</th><th>Total</th><th>Status</th><th>Placed</th></tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
        </table>
        <div class="empty-msg" id="ordersEmptyMsg" style="display:none;">You haven't placed any orders yet.</div>
    </div>
</main>

<script>
function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
}
function showBanner(text, type) {
    const banner = document.getElementById('msgBanner');
    banner.textContent = text;
    banner.className = 'msg-banner ' + type;
    setTimeout(() => { banner.style.display = 'none'; }, 4000);
}

(async function init() {
    try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (!data.loggedIn) {
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('greeting').textContent = `Welcome back, ${data.user.name}!`;

        const addr = data.user.address || {};
        document.getElementById('addrFullName').value = addr.fullName || data.user.name || '';
        document.getElementById('addrPhone').value = addr.phone || '';
        document.getElementById('addrStreet').value = addr.street || '';
        document.getElementById('addrCity').value = addr.city || '';

        loadOrders();
    } catch (err) {
        window.location.href = 'login.html';
    }
})();

document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = 'index.html';
});

document.getElementById('addressForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
        const res = await fetch('/api/auth/address', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                fullName: document.getElementById('addrFullName').value.trim(),
                phone: document.getElementById('addrPhone').value.trim(),
                street: document.getElementById('addrStreet').value.trim(),
                city: document.getElementById('addrCity').value.trim()
            })
        });
        const data = await res.json();
        if (data.success) {
            showBanner('Address saved.', 'success');
        } else {
            showBanner(data.message || 'Could not save address.', 'error');
        }
    } catch (err) {
        showBanner('Could not reach the server.', 'error');
    }
});

async function loadOrders() {
    const tbody = document.getElementById('ordersTableBody');
    const emptyMsg = document.getElementById('ordersEmptyMsg');
    try {
        const res = await fetch('/api/orders/mine');
        const data = await res.json();
        if (!data.success || !data.data.length) {
            tbody.innerHTML = '';
            emptyMsg.style.display = 'block';
            return;
        }
        emptyMsg.style.display = 'none';
        tbody.innerHTML = data.data.map(order => {
            const itemsSummary = (order.items || []).map(i => `${escapeHtml(i.name)} x${i.quantity}`).join(', ');
            const statusClass = 'status-' + (order.status || 'pending').replace(/\s+/g, '-');
            const date = new Date(order.createdAt).toLocaleDateString();
            return `
                <tr>
                    <td>${itemsSummary}</td>
                    <td>$${Number(order.total).toFixed(2)}</td>
                    <td><span class="status-badge ${statusClass}">${escapeHtml(order.status)}</span></td>
                    <td>${date}</td>
                </tr>`;
        }).join('');
    } catch (err) {
        emptyMsg.textContent = 'Could not load your orders.';
        emptyMsg.style.display = 'block';
    }
}
</script>
</body>
</html>
